[project]
name = "gias-visualiser"
version = "0.1.0"
description = "Local browser-based visualiser for GIAS CSV data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "filelock>=4.2.4",
    "httpx>=0.28.1",
    "pyproj>=3.8.0",
    "pytest>=9.2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
gias-visualiser = "gias_visualiser.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
